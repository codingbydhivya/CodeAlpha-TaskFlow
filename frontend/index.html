<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- AUTH VIEW -->
  <section id="auth-view" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="brand"><span class="logo">&#9638;</span> TaskFlow</div>
      <p class="muted">Real-time collaborative workspace</p>
      <div class="tabs">
        <button class="tab active" data-tab="login">Log in</button>
        <button class="tab" data-tab="register">Sign up</button>
      </div>
      <form id="auth-form">
        <input id="auth-name" type="text" placeholder="Full name" class="hidden" />
        <input id="auth-email" type="email" placeholder="Email" required />
        <input id="auth-password" type="password" placeholder="Password (min 6 characters)" required minlength="6" />
        <p id="auth-error" class="error"></p>
        <button type="submit" class="btn primary block" id="auth-submit">Log in</button>
      </form>
    </div>
  </section>

  <!-- APP VIEW -->
  <div id="app-view" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span class="logo">&#9638;</span> TaskFlow</div>
      <div class="sidebar-head">
        <span>Projects</span>
        <button id="new-project-btn" class="icon-btn" title="New project">+</button>
      </div>
      <nav id="project-list" class="project-list"></nav>
      <div class="user-box">
        <div class="avatar" id="user-avatar"></div>
        <div class="user-info">
          <strong id="user-name"></strong>
          <small id="user-email"></small>
        </div>
        <button id="logout-btn" class="btn ghost small">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn menu-btn" aria-label="Menu">&#9776;</button>
        <span id="conn" class="conn off" title="Real-time connection">&#9679; offline</span>
      </header>

      <div id="empty-state" class="empty">
        <h2>Welcome to TaskFlow</h2>
        <p class="muted">Create a project or pick one from the sidebar to start collaborating.</p>
      </div>

      <section id="project-view" class="hidden">
        <div class="project-header">
          <div>
            <h1 id="project-title"></h1>
            <p id="project-desc" class="muted"></p>
          </div>
          <div class="project-actions">
            <button id="members-btn" class="btn ghost">Members</button>
            <button id="edit-project-btn" class="btn ghost">Edit</button>
            <button id="delete-project-btn" class="btn danger-ghost">Delete</button>
            <button id="add-task-btn" class="btn primary">+ Add task</button>
          </div>
        </div>

        <div class="progress-row">
          <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
          <span id="progress-text" class="muted"></span>
        </div>

        <div class="board">
          <div class="column" data-status="todo">
            <div class="col-head"><span class="dot todo"></span> To Do <span class="count" id="count-todo">0</span></div>
            <div class="col-body" id="col-todo"></div>
          </div>
          <div class="column" data-status="in-progress">
            <div class="col-head"><span class="dot progress-dot"></span> In Progress <span class="count" id="count-in-progress">0</span></div>
            <div class="col-body" id="col-in-progress"></div>
          </div>
          <div class="column" data-status="completed">
            <div class="col-head"><span class="dot done"></span> Completed <span class="count" id="count-completed">0</span></div>
            <div class="col-body" id="col-completed"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- PROJECT MODAL -->
  <div id="project-modal" class="modal hidden">
    <form class="modal-card" id="project-form">
      <h3 id="project-modal-title">New project</h3>
      <label>Name<input id="project-name" required maxlength="80" /></label>
      <label>Description<textarea id="project-description" rows="3" maxlength="500"></textarea></label>
      <p class="error" id="project-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>

  <!-- TASK MODAL -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-card wide">
      <form id="task-form">
        <h3 id="task-modal-title">New task</h3>
        <label>Title<input id="task-title" required maxlength="120" /></label>
        <label>Description<textarea id="task-description" rows="3" maxlength="1000"></textarea></label>
        <div class="row">
          <label>Status
            <select id="task-status">
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </label>
          <label>Assign to
            <select id="task-assignee"></select>
          </label>
        </div>
        <p class="error" id="task-error"></p>
        <div class="modal-actions">
          <button type="button" class="btn danger-ghost hidden" id="task-delete">Delete</button>
          <span class="spacer"></span>
          <button type="button" class="btn ghost" data-close>Close</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>

      <div id="comments-section" class="comments hidden">
        <h4>Comments</h4>
        <div id="comment-list" class="comment-list"></div>
        <form id="comment-form" class="comment-form">
          <input id="comment-input" placeholder="Write a comment..." maxlength="1000" autocomplete="off" />
          <button class="btn primary small" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MEMBERS MODAL -->
  <div id="members-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Project members</h3>
      <ul id="member-list" class="member-list"></ul>
      <form id="member-form" class="comment-form">
        <input id="member-email" type="email" placeholder="Add member by email" required />
        <button class="btn primary small" type="submit">Add</button>
      </form>
      <p class="error" id="member-error"></p>
      <div class="modal-actions"><span class="spacer"></span><button class="btn ghost" data-close>Close</button></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
